name: Playwright browsers
description: Chromium and its system libraries, cached on the resolved Playwright version.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "playwright=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}

    # Skips the download when the cache hit; the system libraries it links against are not cached.
    - shell: bash
      run: pnpm exec playwright install --with-deps chromium
