name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No OpenRouter key in tracked source
        run: |
          if git grep -nIE 'sk-or-(v1-)?[A-Za-z0-9]{16,}' -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::An OpenRouter key literal is committed. Rotate it, then remove it."
            exit 1
          fi

      - name: Credential is never client-visible
        run: |
          if git grep -nIE 'VITE_[A-Z_]*(OPENROUTER|API_KEY|SECRET|TOKEN)' -- .; then
            echo "::error::Vite inlines VITE_-prefixed values into the bundle. The key is server-side only."
            exit 1
          fi
          if git grep -nIE 'import\.meta\.env\.[A-Za-z_]*(OPENROUTER|API_KEY|SECRET)' -- .; then
            echo "::error::The credential must not be read from client code (TECHNICAL-DESIGN §3.3)."
            exit 1
          fi

# The "no key in build output" check over dist/ is added in Phase 6, when there is a bundle
# worth grepping and the key is actually wired up (implement-plan §10).
