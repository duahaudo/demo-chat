name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No OpenRouter key in tracked source
        run: |
          if git grep -nIE 'sk-or-(v1-)?[A-Za-z0-9]{16,}' -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::An OpenRouter key literal is committed. Rotate it, then remove it."
            exit 1
          fi

      - name: Credential is never client-visible
        run: |
          if git grep -nIE 'VITE_[A-Z_]*(OPENROUTER|API_KEY|SECRET|TOKEN)' -- .; then
            echo "::error::Vite inlines VITE_-prefixed values into the bundle. The key is server-side only."
            exit 1
          fi
          if git grep -nIE 'import\.meta\.env\.[A-Za-z_]*(OPENROUTER|API_KEY|SECRET)' -- .; then
            echo "::error::The credential must not be read from client code (TECHNICAL-DESIGN §3.3)."
            exit 1
          fi

  build_output:
    name: No key in build output
    runs-on: ubuntu-latest
    # A key is deliberately in scope here: if the bundle can leak it, the scan must be able to see
    # it leak. The build is the same one the deploy runs.
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec vite build

      - name: Grep the bundle
        run: |
          if grep -rIE 'sk-or-(v1-)?[A-Za-z0-9]{16,}|OPENROUTER_API_KEY' dist; then
            echo "::error::The credential reached the bundle. It is server-side only (ADR-0003)."
            exit 1
          fi
          if [ -n "$OPENROUTER_API_KEY" ] && grep -rIqF "$OPENROUTER_API_KEY" dist; then
            echo "::error::The key value is inlined in the bundle."
            exit 1
          fi
